# Extensão do docker-compose.yml para desenvolvimento
services:
  # MongoDB para desenvolvimento
  mongodb:
    image: mongo:7.0
    container_name: empatia-mongodb-dev
    restart: unless-stopped
    network_mode: host
    ports: !reset []
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-empatia}
      DOCKER_ENV: "true"
    volumes:
      - mongodb_data_dev:/data/db
      - ./scripts:/docker-entrypoint-initdb.d
    networks: !reset []

  # MongoDB Express (interface web para MongoDB) - Mantendo para desenvolvimento
  mongo-express:
    image: mongo-express:1.0.2
    container_name: empatia-mongo-express-dev
    restart: unless-stopped
    network_mode: host
    ports: !reset []
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${ME_CONFIG_MONGODB_ADMINUSERNAME:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${ME_CONFIG_MONGODB_ADMINPASSWORD:-admin123}
      - ME_CONFIG_MONGODB_SERVER=${ME_CONFIG_MONGODB_SERVER:-127.0.0.1}
      - ME_CONFIG_MONGODB_PORT=${ME_CONFIG_MONGODB_PORT:-27017}
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD:-admin123}
      # Melhorar performance e timeout
      - ME_CONFIG_REQUEST_SIZE=100mb
      - ME_CONFIG_SITE_GRIDFS_ENABLED=true
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      # Corrigir problemas de compatibilidade
      - ME_CONFIG_OPTIONS_EDITORTHEME=default
      - ME_CONFIG_SITE_SSL_ENABLED=false
      - ME_CONFIG_MONGODB_CONNECTION_TIMEOUT=5000
    depends_on:
      - mongodb
    networks: !reset []

  # Redis - Cache e Sessões
  redis:
    image: redis:7-alpine
    container_name: empatia-redis-dev
    network_mode: host
    ports: !reset []
    volumes:
      - redis_data_dev:/data
    networks: !reset []
    command: redis-server --appendonly yes

  # Qdrant - Vector store exposed locally for development
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: empatia-qdrant-dev
    network_mode: host
    ports: !reset []
    volumes:
      - qdrant_data_dev:/qdrant/storage
    networks: !reset []

  gateway:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
      network: host
    environment:
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - MONGODB_URL=${GATEWAY_MONGODB_URL:-mongodb://admin:admin123@127.0.0.1:27017/empatia?authSource=admin}
      - DATABASE_NAME=${DATABASE_NAME:-empatia}
      - SQL_DEBUG=${DEBUG:-true}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://127.0.0.1:8001}
      - AVATAR_SERVICE_URL=${AVATAR_SERVICE_URL:-http://127.0.0.1:8002}
      - EMOTION_SERVICE_URL=${EMOTION_SERVICE_URL:-http://127.0.0.1:8003}
      - VOICE_SERVICE_URL=${VOICE_SERVICE_URL:-http://127.0.0.1:8004}
      - KNOWLEDGE_SERVICE_URL=${KNOWLEDGE_SERVICE_URL:-http://127.0.0.1:8005}
      - REDIS_URL=${GATEWAY_REDIS_URL:-redis://127.0.0.1:6379}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:7860,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001}
      - HOT_RELOAD=${HOT_RELOAD:-true}
    volumes:
      - ./data/tts_output:/app/tts_output
      - ./services/gateway-service/src:/app/src
    network_mode: host
    ports: !reset []
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug" ]
    depends_on:
      - mongodb
      - redis
      - voice-service
      - knowledge-service
    networks: !reset []

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
      network: host
    network_mode: host
    ports: !reset []
    volumes: !override
      - ./services/ai-service:/app
      - ./services/ai-service/src:/app/src
    environment:
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://127.0.0.1:1234/v1}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_COMPLETIONS_URL=${OPENAI_COMPLETIONS_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-lm-studio}
      - MODEL_NAME=${MODEL_NAME:-gemma-4-e4b}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-none}
      - TEMPERATURE=${TEMPERATURE:-0.3}
      - MAX_TOKENS=${MAX_TOKENS:-700}
      - HOT_RELOAD=${HOT_RELOAD:-true}
      - MONGODB_URI=${AI_MONGODB_URI:-mongodb://admin:admin123@127.0.0.1:27017/empatia?authSource=admin}
      - DATABASE_NAME=${DATABASE_NAME:-empatia}
      - REDIS_URL=${AI_REDIS_URL:-redis://127.0.0.1:6379/0}
      - GATEWAY_SERVICE_URL=${GATEWAY_SERVICE_URL:-http://127.0.0.1:8000}
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--log-level", "debug" ]
    depends_on:
      - mongodb
      - redis
    networks: !reset []

  avatar-service:
    build:
      context: ./services/avatar-service
      dockerfile: Dockerfile
      network: host
    network_mode: host
    ports: !reset []
    environment:
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - DID_API_USERNAME=${DID_API_USERNAME:-}
      - DID_API_PASSWORD=${DID_API_PASSWORD:-}
      - HOT_RELOAD=${HOT_RELOAD:-true}
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload", "--log-level", "debug" ]
    networks: !reset []

  emotion-service:
    build:
      context: ./services/emotion-service
      dockerfile: Dockerfile
      network: host
    environment:
      # CPU por padrão: a GPU fica reservada para o AI Service/local LLM.
      - NVIDIA_VISIBLE_DEVICES=${EMOTION_NVIDIA_VISIBLE_DEVICES:-none}
      - NVIDIA_DRIVER_CAPABILITIES=${EMOTION_NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - CUDA_VISIBLE_DEVICES=${EMOTION_CUDA_VISIBLE_DEVICES:--1}
      # Configurações do serviço
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - OPENFACE_MODEL_PATH=${OPENFACE_MODEL_PATH:-/models/openface}
      - EMOTION_CONFIDENCE_THRESHOLD=${EMOTION_CONFIDENCE_THRESHOLD:-0.7}
      - USE_LEGACY_FALLBACK=${USE_LEGACY_FALLBACK:-false}
      - FORCE_LEGACY_PROCESSOR=${FORCE_LEGACY_PROCESSOR:-false}
      - DEEPFACE_DETECTOR_BACKEND=${DEEPFACE_DETECTOR_BACKEND:-retinaface}
      - DEEPFACE_DETECTOR_BACKENDS=${DEEPFACE_DETECTOR_BACKENDS:-retinaface,opencv}
      - HOT_RELOAD=${HOT_RELOAD:-true}
      # EmotiEffLib específicas
      - USE_LEGACY_LANDMARKS=${USE_LEGACY_LANDMARKS:-false}
      - EMOTIEFF_MODEL=${EMOTIEFF_MODEL:-enet_b0_8_best_afew}
      - TORCH_HOME=/app/models
      - HF_HOME=/app/models/huggingface
      # Configurações TensorFlow: seguras mesmo em CPU e úteis se EMOTION_* habilitar GPU.
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - TF_XLA_FLAGS=--tf_xla_enable_xla_devices
      - CUDA_CACHE_DISABLE=0
      - CUDA_CACHE_MAXSIZE=2147483648
      - TF_GPU_MEMORY_ALLOW_GROWTH=true
    volumes:
      - ./services/emotion-service/src:/app/src
      # Volume para modelos pré-treinados
      - ./data/emotion_models:/app/models
      - ./data/emotion_models/deepface:/root/.deepface
    network_mode: host
    ports: !reset []
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload", "--log-level", "debug" ]
    networks: !reset []

  voice-service:
    build:
      context: ./services/voice-service
      dockerfile: Dockerfile
      network: host
    container_name: empatia-voice-service-dev
    network_mode: host
    ports: !reset []
    environment:
      # Configurações básicas
      - PYTHONPATH=/app
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}

      # Configurações Google Cloud Text-to-Speech
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/empathia-462921-734245aa641d.json
      - TTS_OUTPUT_DIR=/app/output
      - VOICE_SERVICE_BASE_URL=http://localhost:8004

      # Configurações do serviço
      - HOST=0.0.0.0
      - PORT=8004
      - WORKERS=1
      - HOT_RELOAD=${HOT_RELOAD:-true}
    volumes:
      # Volume para desenvolvimento (hot reload)
      - ./services/voice-service/src:/app/src
      # Volume compartilhado para arquivos de áudio
      - ./data/tts_output:/app/output
      # Volume para credenciais do GCP (mapeando o arquivo JSON real)
      - ./services/voice-service/credentials/empathia-462921-734245aa641d.json:/app/credentials/empathia-462921-734245aa641d.json:ro
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8004", "--reload", "--log-level", "debug" ]
    networks: !reset []
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  knowledge-service:
    build:
      context: ./services/knowledge-service
      dockerfile: Dockerfile
      network: host
    container_name: empatia-knowledge-service-dev
    network_mode: host
    ports: !reset []
    environment:
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - KNOWLEDGE_STORAGE_BACKEND=${KNOWLEDGE_STORAGE_BACKEND:-in-memory}
      - KNOWLEDGE_STORAGE_DIR=${KNOWLEDGE_STORAGE_DIR:-/knowledge_data}
      - KNOWLEDGE_LEXICAL_INDEX=${KNOWLEDGE_LEXICAL_INDEX:-sqlite-fts5-planned}
      - MONGODB_URL=${MONGODB_URL:-mongodb://admin:admin123@127.0.0.1:27017/empatia?authSource=admin}
      - DATABASE_NAME=${DATABASE_NAME:-empatia}
      - QDRANT_URL=${QDRANT_URL:-http://127.0.0.1:6333}
      - HOT_RELOAD=${HOT_RELOAD:-true}
    volumes: !override
      - ./services/knowledge-service/src:/app/src
      - ./services/knowledge-service/tests:/app/tests
      - ./data/knowledge:/knowledge_data
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8005", "--reload", "--log-level", "debug" ]
    depends_on:
      - mongodb
      - qdrant
    networks: !reset []

  web-ui:
    build:
      context: ./apps/web-ui
      dockerfile: Dockerfile.dev
      network: host
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=${VITE_API_URL:-http://127.0.0.1:8000}
      - BACKEND_URL=${BACKEND_URL:-http://127.0.0.1:8000}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_GOOGLE_REDIRECT_URI=${VITE_GOOGLE_REDIRECT_URI:-http://localhost:7860}
    volumes:
      - ./apps/web-ui/src:/app/src
      - ./apps/web-ui/public:/app/public
    network_mode: host
    ports: !reset []
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "7860" ]
    networks: !reset []

  admin-panel:
    build:
      context: ./apps/admin-panel
      dockerfile: Dockerfile.dev
      network: host
    container_name: empatia-admin-panel-dev
    network_mode: host
    ports: !reset []
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://127.0.0.1:8000}
      - VITE_EMOTION_SERVICE_URL=http://localhost:8003
      - VITE_VOICE_SERVICE_URL=http://localhost:8004
      - VITE_AI_SERVICE_URL=http://localhost:8001
      - VITE_AVATAR_SERVICE_URL=http://localhost:8002
      - VITE_KNOWLEDGE_SERVICE_URL=http://localhost:8005
      - BACKEND_URL=${BACKEND_URL:-http://127.0.0.1:8000}
    depends_on:
      - gateway
      - emotion-service
      - ai-service
      - voice-service
      - knowledge-service
    networks: !reset []
    volumes:
      - ./apps/admin-panel/src:/app/src
      - ./apps/admin-panel/public:/app/public
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3001" ]

# Volumes para dados persistentes
volumes:
  mongodb_data_dev:
  redis_data_dev:
  qdrant_data_dev:
  knowledge_data_dev:
  postgres_data_dev: # Novos volumes para o voice-service

  voice_output_dev:
  f5_tts_cache_dev:
  torch_cache_dev:

    # Rede para comunicação entre serviços
networks:
  empatia-network:
    driver: bridge

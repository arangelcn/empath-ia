services:
  # MongoDB - Banco principal para persistência
  mongodb:
    image: mongo:7.0
    container_name: empatia-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-empatia}
    volumes:
      - mongodb_data:/data/db
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - empatia-network

  # Gateway Service - Ponto de entrada principal
  gateway:
    build: ./services/gateway-service
    container_name: empatia-gateway
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8001}
      - EMOTION_SERVICE_URL=${EMOTION_SERVICE_URL:-http://emotion-service:8003}
      - VOICE_SERVICE_URL=${VOICE_SERVICE_URL:-http://voice-service:8004}
      - KNOWLEDGE_SERVICE_URL=${KNOWLEDGE_SERVICE_URL:-http://knowledge-service:8005}
      - MONGODB_URL=${MONGODB_URL:-mongodb://admin:admin123@mongodb:27017/empatia?authSource=admin}
      - DATABASE_NAME=${DATABASE_NAME:-empatia}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SECRET_KEY=${SECRET_KEY:-changeme-must-be-at-least-32-characters-long!}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    volumes:
      - ./services/gateway-service:/app
      - ./data/shared:/shared_data
      - ./data/uploads:/uploads
      - ./data/tts_output:/app/tts_output
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - mongodb
      - ai-service
      - emotion-service
      - voice-service
      - knowledge-service
    networks:
      - empatia-network
    develop:
      watch:
        - action: sync
          path: ./services/gateway-service/src
          target: /app/src
          ignore:
            - __pycache__/

  # AI Service - OpenAI e Psicólogo Rogers
  ai-service:
    build:
      context: ./services/ai-service
    container_name: empatia-ai-service
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_COMPLETIONS_URL=${OPENAI_COMPLETIONS_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-lm-studio}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - MODEL_NAME=${MODEL_NAME:-gemma-4-e4b}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-none}
      - TEMPERATURE=${TEMPERATURE:-0.3}
      - MAX_TOKENS=${MAX_TOKENS:-700}
      - AI_SERVICE_PORT=${AI_SERVICE_PORT:-8001}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MONGODB_URI=${MONGODB_URL:-mongodb://admin:admin123@mongodb:27017/empatia?authSource=admin}
      - DATABASE_NAME=${DATABASE_NAME:-empatia}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    volumes:
      - ./services/ai-service:/app
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    depends_on:
      - mongodb
    networks:
      - empatia-network
    develop:
      watch:
        - action: sync
          path: ./services/ai-service/src
          target: /app/src
          ignore:
            - __pycache__/

  # Emotion Service - OpenFace
  emotion-service:
    build: ./services/emotion-service
    container_name: empatia-emotion-service
    env_file:
      - .env
    environment:
      # CPU por padrão: a GPU fica reservada para o AI Service/local LLM.
      - NVIDIA_VISIBLE_DEVICES=${EMOTION_NVIDIA_VISIBLE_DEVICES:-none}
      - CUDA_VISIBLE_DEVICES=${EMOTION_CUDA_VISIBLE_DEVICES:--1}
      - OPENFACE_MODEL_PATH=${OPENFACE_MODEL_PATH:-/models/openface}
      - EMOTION_CONFIDENCE_THRESHOLD=${EMOTION_CONFIDENCE_THRESHOLD:-0.7}
      - EMOTION_SERVICE_PORT=${EMOTION_SERVICE_PORT:-8003}
      - USE_LEGACY_FALLBACK=${USE_LEGACY_FALLBACK:-false}
      - FORCE_LEGACY_PROCESSOR=${FORCE_LEGACY_PROCESSOR:-false}
      - DEEPFACE_DETECTOR_BACKEND=${DEEPFACE_DETECTOR_BACKEND:-retinaface}
      - DEEPFACE_DETECTOR_BACKENDS=${DEEPFACE_DETECTOR_BACKENDS:-retinaface,opencv}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - TF_GPU_MEMORY_ALLOW_GROWTH=true
    volumes:
      - ./services/emotion-service:/app
      - ./data/shared:/shared_data
      - ./data/emotion_models/deepface:/root/.deepface
    ports:
      - "${EMOTION_SERVICE_PORT:-8003}:8003"
    networks:
      - empatia-network
    develop:
      watch:
        - action: sync
          path: ./services/emotion-service/src
          target: /app/src
          ignore:
            - __pycache__/

  # Voice Service - Google Cloud Text-to-Speech
  voice-service:
    build: ./services/voice-service
    container_name: empatia-voice-service
    env_file:
      - .env
    environment:
      - VOICE_SERVICE_PORT=${VOICE_SERVICE_PORT:-8004}
      - VOICE_SERVICE_BASE_URL=${VOICE_SERVICE_BASE_URL:-http://voice-service:8004}
      # Configurações Google Cloud Text-to-Speech
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/empathia-462921-28cb9105b799.json
      - TTS_OUTPUT_DIR=/app/output
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./services/voice-service:/app
      - ./data/tts_output:/app/output
      # Volume para credenciais do GCP
      - ./services/voice-service/credentials/empathia-462921-28cb9105b799.json:/app/credentials/empathia-462921-28cb9105b799.json:ro
    ports:
      - "${VOICE_SERVICE_PORT:-8004}:8004"
    networks:
      - empatia-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    develop:
      watch:
        - action: sync
          path: ./services/voice-service/src
          target: /app/src
          ignore:
            - __pycache__/

  # Knowledge Service - Admin-controlled RAG and provenance
  knowledge-service:
    build: ./services/knowledge-service
    container_name: empatia-knowledge-service
    env_file:
      - .env
    environment:
      - KNOWLEDGE_SERVICE_PORT=${KNOWLEDGE_SERVICE_PORT:-8005}
      - KNOWLEDGE_STORAGE_BACKEND=${KNOWLEDGE_STORAGE_BACKEND:-in-memory}
      - KNOWLEDGE_STORAGE_DIR=${KNOWLEDGE_STORAGE_DIR:-/knowledge_data}
      - KNOWLEDGE_LEXICAL_INDEX=${KNOWLEDGE_LEXICAL_INDEX:-sqlite-fts5-planned}
      - MONGODB_URL=${MONGODB_URL:-mongodb://admin:admin123@mongodb:27017/empatia?authSource=admin}
      - DATABASE_NAME=${DATABASE_NAME:-empatia}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./services/knowledge-service:/app
      - ./data/knowledge:/knowledge_data
    ports:
      - "${KNOWLEDGE_SERVICE_PORT:-8005}:8005"
    depends_on:
      - mongodb
      - qdrant
    networks:
      - empatia-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=5).read()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./services/knowledge-service/src
          target: /app/src
          ignore:
            - __pycache__/

  # Web UI - React + Vite Frontend
  web-ui:
    build:
      context: ./apps/web-ui
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_VOICE_URL: ${VITE_VOICE_URL:-}
    container_name: empatia-web-ui
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - BACKEND_URL=${BACKEND_URL:-http://gateway-service:8000}
    ports:
      - "${WEB_UI_PORT:-7860}:3000"
    depends_on:
      - gateway
    networks:
      - empatia-network

  # Admin Panel - React + Vite Frontend
  admin-panel:
    build: ./apps/admin-panel
    container_name: empatia-admin-panel
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
      - BACKEND_URL=${BACKEND_URL:-http://gateway-service:8000}
    ports:
      - "${ADMIN_PANEL_PORT:-3001}:3000"
    depends_on:
      - gateway
    networks:
      - empatia-network

  # OpenFace - Análise Facial (sob demanda)
  openface:
    build: ./infrastructure/docker/base/openface-base
    container_name: empatia-openface
    volumes:
      - ./data/shared:/data
    networks:
      - empatia-network
    profiles:
      - tools
    restart: "no"

  # Redis - Cache e Sessões
  redis:
    image: redis:7-alpine
    container_name: empatia-redis
    volumes:
      - redis_data:/data
    networks:
      - empatia-network
    command: redis-server --appendonly yes

  # Qdrant - Vector store for the future Knowledge Service index
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: empatia-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - empatia-network

  # PostgreSQL - Banco de dados (opcional)
  postgres:
    image: postgres:15-alpine
    container_name: empatia-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-empatia}
      - POSTGRES_USER=${POSTGRES_USER:-empatia_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-strong_password_here}
      - DATABASE_URL=${DATABASE_URL:-postgresql://empatia_user:strong_password_here@db:5432/empatia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - empatia-network
    profiles:
      - database

networks:
  empatia-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  postgres_data:
  qdrant_data:
  knowledge_data:
  voice_cache:
    # Cache para modelos TTS

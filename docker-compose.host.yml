# Host-network runtime overlay for local development.
#
# Use this when Docker bridge/veth networking or embedded DNS is unstable.
# Services communicate through 127.0.0.1 on the host network, so Compose
# service DNS names like "mongodb" and "redis" are intentionally avoided.
services:
  mongodb:
    network_mode: host
    networks: !reset []
    ports: !reset []

  mongo-express:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      - ME_CONFIG_MONGODB_SERVER=127.0.0.1
      - ME_CONFIG_MONGODB_PORT=27017

  redis:
    network_mode: host
    networks: !reset []
    ports: !reset []

  qdrant:
    network_mode: host
    networks: !reset []
    ports: !reset []

  gateway:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      - AI_SERVICE_URL=http://127.0.0.1:8001
      - EMOTION_SERVICE_URL=http://127.0.0.1:8003
      - VOICE_SERVICE_URL=http://127.0.0.1:8004
      - KNOWLEDGE_SERVICE_URL=http://127.0.0.1:8005
      - MONGODB_URL=mongodb://admin:admin123@127.0.0.1:27017/empatia?authSource=admin
      - REDIS_URL=redis://127.0.0.1:6379
      - ALLOWED_ORIGINS=http://localhost:7860,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001

  ai-service:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      - AI_SERVICE_PORT=8001
      - GATEWAY_SERVICE_URL=http://127.0.0.1:8000
      - MONGODB_URL=mongodb://admin:admin123@127.0.0.1:27017/empatia?authSource=admin
      - DATABASE_NAME=empatia
      - AI_SERVICE_V2_ENABLE_LEGACY_RUNTIME_FALLBACK=false
      - EMOTION_SERVICE_URL=http://127.0.0.1:8003
      - VOICE_SERVICE_URL=http://127.0.0.1:8004
      - KNOWLEDGE_SERVICE_URL=http://127.0.0.1:8005

  emotion-service:
    network_mode: host
    networks: !reset []
    ports: !reset []

  voice-service:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      - VOICE_SERVICE_BASE_URL=http://localhost:8004

  knowledge-service:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      - MONGODB_URL=mongodb://admin:admin123@127.0.0.1:27017/empatia?authSource=admin
      - QDRANT_URL=http://127.0.0.1:6333
      - KNOWLEDGE_STORAGE_DIR=/knowledge_data

  web-ui:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      - VITE_API_URL=http://127.0.0.1:8001
      - BACKEND_URL=http://127.0.0.1:8001
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "7860"]

  admin-panel:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      - VITE_API_URL=http://127.0.0.1:8001
      - VITE_EMOTION_SERVICE_URL=http://localhost:8003
      - VITE_VOICE_SERVICE_URL=http://localhost:8004
      - VITE_AI_SERVICE_URL=http://localhost:8001
      - VITE_KNOWLEDGE_SERVICE_URL=http://localhost:8005
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3001"]
